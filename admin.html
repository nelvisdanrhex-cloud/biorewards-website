
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioRewards | Admin</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .admin-page {
            min-height: 100vh;
            padding: 40px 20px;
            background: #07140e;
            color: white;
        }

        .admin-container {
            max-width: 850px;
            margin: 60px auto;
        }

        .admin-login {
            max-width: 420px;
            margin: auto;
            padding: 35px;
            background: #10251a;
            border: 1px solid #39df7050;
            border-radius: 18px;
        }

        .admin-login h1 {
            color: #39df70;
            margin-bottom: 10px;
        }

        .admin-login p {
            color: #a5b9aa;
            margin-bottom: 25px;
        }

        .admin-login input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #315b40;
            background: #07140e;
            color: white;
        }

        .admin-login button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #39df70;
            color: #07140e;
            font-weight: bold;
        }

        .admin-notice {
            margin-top: 20px;
            color: #a5f3b5;
            font-size: 13px;
            line-height: 1.6;
        }

        .admin-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .admin-header h1 {
            color: #39df70;
        }

        .admin-stat {
            padding: 22px;
            background: #10251a;
            border: 1px solid #39df7040;
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .admin-stat h2 {
            color: #39df70;
        }
    </style>
</head>

<body>
    <main class="admin-page">

        <div class="admin-container">

            <div class="admin-login">
                <h1>🌿 BioRewards</h1>
                <h2>Administrator Login</h2>
                <p>Authorized administrators only.</p>

                <form id="adminLoginForm">
                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Admin email"
                        required
                    >

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Password"
                        required
                    >

                    <button type="submit">
                        Sign In
                    </button>
                </form>

                <div class="admin-notice">
                    🔒 Admin authentication will be connected
                    through Firebase before this login is activated.
                </div>
            </div>

        </div>

    </main>
</body>
</html>
