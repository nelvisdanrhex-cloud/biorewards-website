<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioRewards | Account</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .social-login {
            margin-top: 25px;
        }

        .social-login button {
            width: 100%;
            margin-top: 10px;
            background: #fff;
            color: #173b25;
            border: 1px solid #8cffad;
        }

        .social-login button:hover {
            background: #dfffe9;
            color: #173b25;
        }

        .account-container [hidden] {
            display: none !important;
        }

        .account-tabs button.active {
            background: #35cf70;
        }
    </style>
</head>

<body>

<main class="account-container">

    <h1>🌿 BioRewards</h1>
    <p>Make the planet greener, one action at a time.</p>

    <div class="account-tabs">
        <button type="button" id="loginTab" class="active">Login</button>
        <button type="button" id="registerTab">Register</button>
    </div>

    <form id="loginForm">
        <h2>Welcome Back!</h2>

        <input type="email" id="loginEmail"
            placeholder="Email address" required>

        <input type="password" id="loginPassword"
            placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

    <form id="registerForm" hidden>
        <h2>Create Account</h2>

        <input type="text" id="registerName"
            placeholder="Full name" required>

        <input type="email" id="registerEmail"
            placeholder="Email address" required>

        <input type="password" id="registerPassword"
            placeholder="Password (at least 6 characters)"
            minlength="6" required>

        <button type="submit">Create Account</button>
    </form>

    <div class="social-login">
        <p>Or continue with</p>
        <button type="button" id="googleLogin">
            🌐 Continue with Google
        </button>
    </div>

    <p id="accountMessage" aria-live="polite"></p>

    <a href="index.html">← Back to Homepage</a>

</main>

<script type="module">

import { auth, db } from "./firebase.js";

import {
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    updateProfile,
    GoogleAuthProvider,
    signInWithPopup
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

import {
    doc,
    setDoc,
    getDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";


const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");
const message = document.getElementById("accountMessage");

const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");


loginTab.addEventListener("click", () => {
    loginForm.hidden = false;
    registerForm.hidden = true;

    loginTab.classList.add("active");
    registerTab.classList.remove("active");

    message.textContent = "";
});


registerTab.addEventListener("click", () => {
    loginForm.hidden = true;
    registerForm.hidden = false;

    loginTab.classList.remove("active");
    registerTab.classList.add("active");

    message.textContent = "";
});


registerForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const name = document.getElementById("registerName").value.trim();
    const email = document.getElementById("registerEmail").value.trim();
    const password = document.getElementById("registerPassword").value;

    try {
        message.textContent = "Creating account...";

        const result = await createUserWithEmailAndPassword(
            auth, email, password
        );

        await updateProfile(result.user, {
            displayName: name
        });

        await setDoc(doc(db, "users", result.user.uid), {
            name: name,
            email: email,
            points: 0,
            createdAt: serverTimestamp()
        });

        message.textContent = "Account created successfully!";

        window.location.href = "index.html";

    } catch (error) {
        message.textContent = error.message;
    }
});


loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    try {
        message.textContent = "Logging in...";

        await signInWithEmailAndPassword(auth, email, password);

        window.location.href = "index.html";

    } catch (error) {
        message.textContent = error.message;
    }
});


document.getElementById("googleLogin").addEventListener("click", async () => {

    try {
        message.textContent = "Connecting to Google...";

        const provider = new GoogleAuthProvider();

        const result = await signInWithPopup(auth, provider);

        const user = result.user;

        const userRef = doc(db, "users", user.uid);
        const existingUser = await getDoc(userRef);

        if (!existingUser.exists()) {
            await setDoc(userRef, {
                name: user.displayName || "BioRewards User",
                email: user.email,
                points: 0,
                createdAt: serverTimestamp()
            });
        }

        window.location.href = "index.html";

    } catch (error) {
        message.textContent = error.message;
    }

});

</script>

</body>
</html>
